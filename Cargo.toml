[package]
name = "rtg-tui"
version = "0.1.13"
edition = "2021"
description = "A terminal-first Telegram client written in Rust."
license = "MIT"
repository = "https://github.com/bercly0b/rtg"

[[bin]]
name = "rtg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
crossterm = "0.29"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
rpassword = "7.3"
tdlib-rs = { version = "1.4", features = ["download-tdlib", "static"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-width = "0.2"
arboard = "3"
open = "5"
dirs = "6"
libc = "0.2"
base64 = "0.22"
shell-words = "1.1"
# Both already come through tdlib-rs (`download-tdlib`), so the update check
# adds no new crates.
ureq = "3"
serde_json = "1"

[dev-dependencies]
tempfile = "3.25.0"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
allow_attributes_without_reason = "warn"
