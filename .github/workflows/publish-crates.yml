name: Publish to crates.io

# Called by release.yml as a dist custom publish job
# (`publish-jobs` in dist-workspace.toml); never runs on its own.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    # Pinned for the same reason as the quality gate: the prebuilt TDLib that
    # `cargo publish` links while verifying the package needs Ubuntu 24.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Repository checkout
        uses: actions/checkout@v5

      - name: Install TDLib runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Tools bootstrap (mise.toml)
        uses: jdx/mise-action@v5

      - name: Publish rtg-tui
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
