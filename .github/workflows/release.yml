name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  # Builds every release target for changes that can break the build;
  # nothing is published from a pull request.
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/release.yml

jobs:
  verify:
    name: Verify version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v5

      - name: Check Cargo.toml matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version $TAG_VERSION verified"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    # `verify` is skipped on pull requests.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Repository checkout
        uses: actions/checkout@v5

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Tools bootstrap (mise.toml)
        uses: jdx/mise-action@v5

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check the binary runs without libtdjson
        run: |
          cargo test --release --target ${{ matrix.target }} --test static_tdlib
          "target/${{ matrix.target }}/release/rtg" --version

      - name: Package archive
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          ARCHIVE="rtg-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE/bin"

          cp "target/${{ matrix.target }}/release/rtg" "$ARCHIVE/bin/rtg"
          chmod +x "$ARCHIVE/bin/rtg"

          cp install.sh "$ARCHIVE/install.sh"
          chmod +x "$ARCHIVE/install.sh"

          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
